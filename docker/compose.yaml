services:
  mern-backend:
    build:
      context: ../mern-demo/server
      dockerfile: Dockerfile
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI before starting the backend service}
    env_file:
      - ../mern-demo/server/.env
    restart: unless-stopped

  mern-frontend:
    build:
      context: ../mern-demo/client
      dockerfile: Dockerfile
    container_name: mern-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://mern-backend:5000
    depends_on:
      - mern-backend
    restart: unless-stopped